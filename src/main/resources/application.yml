server:
  port: 8080
  shutdown: graceful
  mime-mappings:
    yml: application/yaml # so the contract at /api.yml opens in a browser instead of downloading

spring:
  application:
    name: bank-account-api
  main:
    banner-mode: off
  datasource:
    # Read from the environment. Real deployments load DB_PASSWORD from a secrets manager.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:bank}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies for errors raised by Spring MVC itself
  jackson:
    deserialization:
      # Amounts are whole minor units. Reject 10.5 instead of silently turning it into 10.
      accept-float-as-int: false

management:
  server:
    port: 9090 # keeps health and metrics off the public API port
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Not ready without a database. Liveness stays DB-free so a DB outage does not trigger restarts.
        readiness:
          include: readinessState, db
