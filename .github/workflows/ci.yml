name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew build

      - name: Check the committed jOOQ classes match the migrations
        run: |
          make jooq
          git status --porcelain -- jooq-generated
          test -z "$(git status --porcelain -- jooq-generated)" || {
            echo "jooq-generated/ is out of date. Run 'make jooq' and commit the result." >&2
            exit 1
          }

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
