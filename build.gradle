plugins {
    id "com.adarshr.test-logger" version "4.0.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "java"
    id "org.jooq.jooq-codegen-gradle" version "3.21.9"
    id "org.openapi.generator" version "7.14.0"
    id "org.springframework.boot" version "4.1.2"
}

group = "com.sumup"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

/*
 * OpenAPI: src/main/resources/static/api.yml is the HTTP contract (also served at /api.yml).
 * On every build it generates the controller interfaces and request/response models into
 * build/generated/openapi. Controllers implement the generated interfaces.
 * Generator options: https://openapi-generator.tech/docs/generators/spring
 */
def openApiOutput = layout.buildDirectory.dir("generated/openapi")
openApiGenerate {
    generatorName = "spring"
    inputSpec = layout.projectDirectory.file("src/main/resources/static/api.yml").asFile.path
    outputDir = openApiOutput.get().asFile.path
    apiPackage = "com.sumup.bankaccount.adapters.primary.web"
    modelPackage = "com.sumup.bankaccount.adapters.primary.web.model"
    cleanupOutput = true
    // Only the API interfaces and models: no sample application, pom.xml, or README.
    globalProperties = [apis: "", models: ""]
    // Keep timestamps as Instant, as in the domain model.
    typeMappings = [DateTime: "Instant"]
    importMappings = [Instant: "java.time.Instant"]
    configOptions = [
            interfaceOnly             : "true",
            skipDefaultInterface      : "true",
            useTags                   : "true",
            useSpringBoot3            : "true",
            // No class-level @Validated: Spring MVC's built-in validation reports bad headers as 400.
            useSpringBuiltInValidation: "true",
            // JsonNullable needs Jackson 2; plain nullable fields are enough here.
            openApiNullable           : "false",
            annotationLibrary         : "none",
            documentationProvider     : "none",
            sourceFolder              : "src/main/java",
            // Stable output, so unchanged code produces unchanged class files and image layers.
            hideGenerationTimestamp   : "true",
    ]
}
tasks.named("openApiGenerate") {
    // The generator still writes Spring's deprecated @Nullable. Use JSpecify, like the rest of the code.
    doLast {
        fileTree(openApiOutput) { include "**/*.java" }.each { source ->
            source.text = source.text.replace(
                    "import org.springframework.lang.Nullable;", "import org.jspecify.annotations.Nullable;")
        }
    }
}
sourceSets.main.java.srcDir(openApiOutput.map { it.dir("src/main/java") })
tasks.named("compileJava") {
    dependsOn tasks.named("openApiGenerate")
}

/*
 * jOOQ: type-safe SQL classes generated from the database schema. The output is committed in
 * jooq-generated/, so building needs no database. After changing a migration, run `make jooq`:
 * it starts a throwaway PostgreSQL, applies the migrations, and runs this task with
 * -PjooqJdbcUrl. CI fails if the committed classes are out of date.
 * Plugin docs: https://www.jooq.org/doc/latest/manual/code-generation/codegen-gradle/
 */
def jooqOutput = "jooq-generated/src/main/java"
jooq {
    configuration {
        logging = org.jooq.meta.jaxb.Logging.WARN
        jdbc {
            driver = "org.postgresql.Driver"
            url = providers.gradleProperty("jooqJdbcUrl").getOrElse("jdbc:postgresql://localhost:5432/bank")
            // The throwaway database uses trust auth, so there is no password to store.
            user = "bank"
        }
        generator {
            database {
                name = "org.jooq.meta.postgres.PostgresDatabase"
                inputSchema = "public"
                excludes = "flyway_schema_history"
            }
            generate {
                deprecated = false
                records = true
                pojos = false
                javaTimeTypes = true
            }
            target {
                packageName = "com.sumup.bankaccount.adapters.secondary.postgres.jooq"
                directory = jooqOutput
            }
        }
    }
}
// Generate only when asked (make jooq). Normal builds compile the committed classes.
tasks.named("jooqCodegen") {
    onlyIf("run through make jooq, which passes -PjooqJdbcUrl") { providers.gradleProperty("jooqJdbcUrl").isPresent() }
}
sourceSets.main.java.srcDir(jooqOutput)

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-jooq"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.flywaydb:flyway-database-postgresql"
    runtimeOnly "io.micrometer:micrometer-registry-prometheus"
    runtimeOnly "org.postgresql:postgresql"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-jooq-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testImplementation "com.tngtech.archunit:archunit-junit5:1.5.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    jooqCodegen "org.postgresql:postgresql"
    mockitoAgent("org.mockito:mockito-core") {
        transitive = false
    }
}

tasks.named("test") {
    useJUnitPlatform()
    // Load Mockito as an agent at startup: recent JDKs warn about agents attached at runtime.
    doFirst {
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    }
    // Avoids a class-data-sharing warning that appears when the Mockito agent is loaded.
    jvmArgs "-Xshare:off"
}

// A fixed jar name keeps the Dockerfile independent of the project version.
tasks.named("bootJar") {
    archiveFileName = "app.jar"
}

// Only the executable Spring Boot jar is needed.
tasks.named("jar") {
    enabled = false
}
